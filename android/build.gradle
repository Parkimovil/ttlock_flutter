group 'com.ttlock.ttlock_flutter'
version '1.0'

buildscript {
    ext {
        agp_version = '7.4.2'
    }
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
        flatDir {
            dirs 'libs'
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.ttlock.ttlock_flutter'
    compileSdkVersion 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 16 KB page-size compatibility (Android 15+): keep .so files uncompressed
    // and page-aligned inside the consuming APK/AAB. Required for Play Console
    // uploads with targetSdkVersion >= 35.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 3.5.5+ ships libLockCore.so with p_align=0x4000 on arm64-v8a and x86_64,
    // which is required for Android 15+ 16 KB pages. Do not downgrade below 3.5.5.
    implementation 'com.ttlock:ttlock:3.5.6'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
